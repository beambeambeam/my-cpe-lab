_min_copier_version: "9.0"

lab_number:
  type: int
  help: Lab number
  validator: >-
    {% if lab_number < 1 %}Lab number must be positive{% endif %}

project_name:
  type: str
  default: "lab{{ '%02d' | format(lab_number) }}"
  when: false

python_version:
  type: str
  help: Python version
  default: "3.12"

dependencies:
  type: yaml
  help: Runtime dependencies
  default:
    - ipykernel>=7.3.0
    - jinja2>=3.1.6
    - matplotlib>=3.11.1
    - numpy>=2.5.2
    - pandas>=3.0.5
    - scipy>=1.18.0
    - seaborn>=0.13.2
    - statsmodels>=0.14.6

dev_dependencies:
  type: yaml
  help: Development dependencies
  default:
    - nbclient>=0.11.0
    - nbformat>=5.11.0

_message_after_copy: |
  Generated {{ project_name }}.

  Next step:
    uv sync
